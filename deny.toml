# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on RUSTSEC vulnerabilities, unmaintained and yanked crates.
yanked = "deny"

[licenses]
# Permissive licenses compatible with shipping sirocco under MIT OR Apache-2.0.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
